<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris — Neon Arcade</title>
<style>
  /* ============================================================
   * 디자인 토큰 — 색·간격·타이포의 유일한 출처.
   * 조각 색과 격자 색도 여기에만 있다. JS 는 이 값을 읽어 쓴다.
   * ============================================================ */
  :root {
    /* 심연 계열: 완전한 검정이 아니라 깊은 청록/보라 */
    --ink-abyss: #04080f;
    --ink-deep: #08111d;
    --ink-panel: #0c1626;
    --ink-raised: #122036;
    --hair: #1d3350;

    /* 네온 */
    --neon-cyan: #35f0e0;
    --neon-violet: #7b5cff;
    --neon-magenta: #ff4d9d;
    --neon-danger: #ff3355;

    --text-bright: #e8f6ff;
    --text-dim: #7f9ab8;

    /* 조각 색 (JS 는 --piece-1 ~ --piece-7 을 읽는다) */
    --color-grid: #16283f;
    --piece-1: #48c9d8;
    --piece-2: #4a72d8;
    --piece-3: #d88f3f;
    --piece-4: #d8cf46;
    --piece-5: #5cc45c;
    --piece-6: #a35cd0;
    --piece-7: #d8544f;

    /* 리듬: 균일하지 않은 간격 계단 */
    --space-hair: 4px;
    --space-tight: 8px;
    --space-snug: 14px;
    --space-rail: 22px;
    --space-stage: 34px;
    --space-page: clamp(10px, 3vw, 40px);

    --radius-chip: 3px;
    --radius-panel: 10px;
    --radius-stage: 14px;

    --font-display: "Bahnschrift", "DIN Alternate", "Avenir Next Condensed",
      "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
    --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

    --track-label: 0.3em;
    --dur-veil: 260ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    --stage-halo-a: rgba(53, 240, 224, 0.42);
    --stage-halo-b: rgba(123, 92, 255, 0.34);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    background:
      radial-gradient(115% 85% at 10% -5%, rgba(53, 240, 224, 0.10), transparent 58%),
      radial-gradient(95% 75% at 92% 4%, rgba(255, 77, 157, 0.11), transparent 60%),
      radial-gradient(130% 110% at 50% 118%, rgba(123, 92, 255, 0.16), transparent 68%),
      var(--ink-abyss);
    color: var(--text-bright);
    font-family: var(--font-display);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: var(--space-page);
    overflow-x: hidden;
  }

  /* 질감: 아주 옅은 주사선. 배경을 죽은 평면으로 두지 않는다. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.022) 0 1px,
      transparent 1px 3px
    );
    z-index: 2;
  }

  /* ---------- 캐비닛 ---------- */
  .cabinet { width: 100%; max-width: 700px; }

  .cabinet__head {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: var(--space-snug);
    margin: 0 0 var(--space-stage);
  }
  .wordmark {
    margin: 0;
    font-size: clamp(1.5rem, 1rem + 2.4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    line-height: 0.95;
    background: linear-gradient(96deg, var(--neon-cyan), var(--neon-violet) 62%, var(--neon-magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .wordmark__sub {
    margin: 0;
    font-size: 0.625rem;
    letter-spacing: var(--track-label);
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* ---------- 덱: 보드가 주인공. 좌우 레일 간격이 서로 다르다 ---------- */
  .deck {
    display: grid;
    grid-template-columns: 200px auto 138px;
    justify-content: center;
    align-items: start;
  }
  /* 리듬: 왼쪽이 넓고 오른쪽이 좁다. 균일한 여백은 두지 않는다. */
  .rail--left  { padding-right: var(--space-stage); text-align: right; }
  .rail--right { padding-left: var(--space-rail); }

  .rail {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .rail--left .slot__canvas { margin-left: auto; }
  /* 리듬: 레일 내부 간격도 균일하지 않다 */
  .rail--left > * + * { margin-top: var(--space-rail); }
  .rail--right > * + * { margin-top: var(--space-snug); }

  .label {
    margin: 0 0 var(--space-tight);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: var(--track-label);
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ---------- 판독기: 점수가 가장 크고, 레벨/줄은 한 단계 아래 ---------- */
  .readout--major .value {
    display: block;
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(2rem, 1.2rem + 3.2vw, 2.9rem);
    font-weight: 700;
    line-height: 0.88;
    letter-spacing: 0.005em;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    color: var(--neon-cyan);
    text-shadow: 0 0 18px rgba(53, 240, 224, 0.55), 0 0 46px rgba(53, 240, 224, 0.22);
  }
  .readout--major .label { color: var(--neon-cyan); opacity: 0.72; }

  .meters {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-tight);
  }
  .meter {
    padding: var(--space-tight) var(--space-snug) 10px;
    background: linear-gradient(180deg, var(--ink-raised), var(--ink-panel));
    border: 1px solid var(--hair);
    border-radius: var(--radius-panel);
    border-top-color: rgba(123, 92, 255, 0.45);
  }
  .meter .label { margin-bottom: 2px; font-size: 0.5rem; }
  .meter .value {
    display: block;
    margin: 0;
    font-family: var(--font-num);
    font-size: clamp(1rem, 0.85rem + 0.6vw, 1.2rem);
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: var(--text-bright);
  }
  .meter--level .value { color: var(--neon-violet); }
  .meter--lines .value { color: var(--neon-magenta); }

  /* ---------- 슬롯 ---------- */
  .slot__canvas {
    display: block;
    width: 100%;
    max-width: 72px;
    height: auto;
    background: rgba(6, 14, 24, 0.72);
    border: 1px solid var(--hair);
    border-radius: var(--radius-chip);
  }
  .slot--next .slot__canvas { max-width: 72px; }

  .keys {
    margin: 0;
    padding: var(--space-snug) 0 0;
    border-top: 1px solid var(--hair);
    font-size: 0.6rem;
    line-height: 1.9;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    list-style: none;
  }
  .keys b {
    display: inline-block;
    min-width: 2.4em;
    color: var(--neon-cyan);
    font-family: var(--font-num);
    font-weight: 600;
  }

  /* ---------- 스테이지: 보드 둘레의 발광을 층으로 쌓는다 ---------- */
  .stage {
    position: relative;
    width: min(280px, 100%);
    padding: 5px;
    border-radius: var(--radius-stage);
    background: linear-gradient(150deg, rgba(53, 240, 224, 0.16), rgba(123, 92, 255, 0.2) 55%, rgba(255, 77, 157, 0.14));
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.06),
      0 0 22px -6px var(--stage-halo-a),
      0 0 64px -12px var(--stage-halo-b),
      0 34px 70px -34px #000;
    transition: box-shadow var(--dur-veil) var(--ease-out);
  }
  .stage.is-over {
    --stage-halo-a: rgba(255, 51, 85, 0.55);
    --stage-halo-b: rgba(255, 51, 85, 0.3);
  }
  #board {
    display: block;
    width: 100%;
    height: auto;
    border-radius: calc(var(--radius-stage) - 5px);
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(53, 240, 224, 0.07), transparent 62%),
      var(--ink-deep);
  }

  /* ---------- 오버레이: 두 상태의 생김새가 서로 다르다 ---------- */
  .veil {
    position: absolute;
    inset: 5px;
    display: flex;
    border-radius: calc(var(--radius-stage) - 5px);
    overflow: hidden;
    z-index: 1;
  }
  [hidden] { display: none !important; }

  /* 일시정지: 얼어붙은 유리. 보드가 비쳐 보이고, 얇은 띠가 흐른다. */
  .veil--pause {
    align-items: flex-end;
    justify-content: stretch;
    background: rgba(8, 22, 34, 0.42);
    backdrop-filter: blur(3px) saturate(0.5);
    -webkit-backdrop-filter: blur(3px) saturate(0.5);
    border: 1px solid rgba(53, 240, 224, 0.45);
  }
  .veil--pause::before {
    content: "";
    position: absolute;
    inset: -40% 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(53, 240, 224, 0.09) 0 2px,
      transparent 2px 7px
    );
    animation: drift 3.2s linear infinite;
  }
  .pause-bar {
    position: relative;
    width: 100%;
    padding: var(--space-snug) var(--space-rail) var(--space-rail);
    background: linear-gradient(to top, rgba(4, 8, 15, 0.92), transparent);
    animation: rise var(--dur-veil) var(--ease-out) both;
  }
  .pause-bar .title {
    display: block;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--neon-cyan);
    text-shadow: 0 0 16px rgba(53, 240, 224, 0.6);
  }
  .pause-bar .hint {
    display: block;
    margin-top: var(--space-hair);
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    color: var(--text-dim);
  }

  /* 게임오버: 붉은 침수. 중앙 정렬 슬랩, 블러 없음, 비네트. */
  .veil--over {
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(85% 70% at 50% 45%, rgba(255, 51, 85, 0.3), transparent 72%),
      rgba(24, 3, 12, 0.9);
    border: 1px solid rgba(255, 51, 85, 0.55);
  }
  .over-slab {
    position: relative;
    padding: var(--space-rail) var(--space-snug);
    text-align: center;
    animation: slam var(--dur-veil) var(--ease-out) both;
  }
  .over-slab .title {
    display: block;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: 0.1em;
    color: var(--neon-danger);
    text-shadow: 0 0 22px rgba(255, 51, 85, 0.65);
  }
  .over-slab .final {
    display: block;
    margin-top: var(--space-snug);
    font-family: var(--font-num);
    font-size: 1.6rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-bright);
  }
  .over-slab .final-label {
    display: block;
    font-size: 0.5rem;
    letter-spacing: var(--track-label);
    color: rgba(255, 51, 85, 0.8);
  }
  .over-slab .hint {
    display: block;
    margin-top: var(--space-snug);
    padding-top: var(--space-tight);
    border-top: 1px solid rgba(255, 51, 85, 0.35);
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    color: var(--text-dim);
  }

  /* 모션은 transform 과 opacity 에만 준다 */
  @keyframes drift {
    from { transform: translateY(0); }
    to   { transform: translateY(7px); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slam {
    from { opacity: 0; transform: scale(1.14); }
    to   { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  /* ---------- 좁은 화면: 320px 에서 가로 스크롤이 없어야 한다 ---------- */
  @media (max-width: 640px) {
    .deck {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      gap: var(--space-rail);
    }
    .rail {
      width: 100%;
      max-width: 300px;
      padding: 0;
      text-align: left;
    }
    .rail--left .slot__canvas { margin-left: 0; }
    .rail--left {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      grid-template-areas: "hold score" "meters meters";
      align-items: end;
      gap: var(--space-snug) var(--space-rail);
    }
    .rail--left > * + * { margin-top: 0; }
    .rail--left .slot { grid-area: hold; }
    .rail--left .readout--major { grid-area: score; }
    .rail--left .meters { grid-area: meters; }
    .rail--right { display: flex; flex-direction: row; align-items: flex-start; gap: var(--space-rail); }
    .rail--right > * + * { margin-top: 0; }
    .slot--next { display: flex; align-items: baseline; gap: var(--space-snug); }
    .slot--next .label { margin-bottom: 0; }
    .slot--next .slot__canvas { width: 54px; }
    .keys { flex: 1; min-width: 0; border-top: 0; padding-top: 0; }
  }
</style>
</head>
<body>
<main class="cabinet">
  <header class="cabinet__head">
    <h1 class="wordmark">TETRIS</h1>
    <p class="wordmark__sub">neon arcade</p>
  </header>

  <div class="deck">
    <aside class="rail rail--left">
      <section class="slot">
        <h2 class="label">Hold</h2>
        <canvas id="hold" class="slot__canvas"></canvas>
      </section>

      <section class="readout readout--major">
        <h2 class="label">Score</h2>
        <p class="value" id="score">0</p>
      </section>

      <div class="meters">
        <section class="meter meter--level">
          <h2 class="label">Level</h2>
          <p class="value" id="level">1</p>
        </section>
        <section class="meter meter--lines">
          <h2 class="label">Lines</h2>
          <p class="value" id="lines">0</p>
        </section>
      </div>
    </aside>

    <div class="stage" id="stage">
      <canvas id="board"></canvas>

      <div class="veil veil--pause" id="veil-pause" hidden>
        <div class="pause-bar">
          <span class="title">PAUSED</span>
          <span class="hint">P / ESC 로 재개</span>
        </div>
      </div>

      <div class="veil veil--over" id="veil-over" hidden>
        <div class="over-slab">
          <span class="title">GAME<br>OVER</span>
          <span class="final-label">final score</span>
          <span class="final" id="final-score">0</span>
          <span class="hint">R 로 다시 시작</span>
        </div>
      </div>
    </div>

    <aside class="rail rail--right">
      <section class="slot slot--next">
        <h2 class="label">Next</h2>
        <canvas id="preview" class="slot__canvas"></canvas>
      </section>
      <ul class="keys">
        <li><b>← →</b> 이동</li>
        <li><b>↓</b> 소프트드롭</li>
        <li><b>SPC</b> 하드드롭</li>
        <li><b>↑ Z</b> 회전</li>
        <li><b>C</b> 홀드</li>
        <li><b>P</b> 일시정지</li>
        <li><b>R</b> 재시작</li>
      </ul>
    </aside>
  </div>
</main>
<script>
/* ============================================================
 * CONFIG — 모든 상수. 이 파일의 다른 곳에 숫자 리터럴을 두지 않는다.
 * ============================================================ */
const CONFIG = {
  COLS: 10,
  ROWS: 22,            // 상단 BUFFER_ROWS 행은 스폰 버퍼 (화면에 보이지 않음)
  BUFFER_ROWS: 2,
  CELL_PX: 28,
  GRID_LINE_PX: 1,
  BLOCK_INSET_PX: 1,
  EMPTY: 0,
  MAX_FRAME_MS: 250,        // 탭 복귀 등으로 델타가 튀는 것을 막는 상한
  LOCK_DELAY_MS: 500,       // 바닥에 닿은 뒤 고정까지의 유예
  LOCK_RESET_LIMIT: 15,     // 조각당 유예 리셋 상한. 없으면 무한 스핀
  LINES_PER_LEVEL: 10,      // 이만큼 지울 때마다 레벨 +1
  START_LEVEL: 1,
  LINE_SCORES: { 1: 100, 2: 300, 3: 500, 4: 800 },  // × 현재 레벨
  SOFT_DROP_POINTS_PER_CELL: 1,
  HARD_DROP_POINTS_PER_CELL: 2,
  // 레벨별 낙하 간격(ms). 프레임 수가 아니라 ms 로 둬야 rAF 주기와 무관하다.
  // 표에 없는 레벨은 마지막 값을 쓴다.
  LEVEL_INTERVALS_MS: {
    1: 1000, 2: 793, 3: 618, 4: 473, 5: 355,
    6: 262, 7: 190, 8: 135, 9: 94, 10: 64,
    11: 43, 12: 28, 13: 18, 14: 11, 15: 7,
  },
  SPAWN_X: 3,
  SPAWN_Y: 0,
  DAS_MS: 167,              // 좌우 키를 누른 뒤 자동 반복이 시작되기까지의 지연
  ARR_MS: 33,               // 자동 반복 간격
  SOFT_DROP_DIVISOR: 20,    // 소프트 드롭 중 낙하 간격 = DROP_INTERVAL_MS / 이 값
  ROTATION_STATES: 4,
  KEYS: {
    LEFT: 'ArrowLeft',
    RIGHT: 'ArrowRight',
    SOFT_DROP: 'ArrowDown',
    HARD_DROP: ' ',
    ROTATE_CW: ['ArrowUp', 'x', 'X'],
    ROTATE_CCW: ['z', 'Z'],
    HOLD: ['c', 'C', 'Shift'],
    PAUSE: ['p', 'P', 'Escape'],
    RESTART: ['r', 'R'],
  },
  ROTATE_CW_DIR: 1,
  ROTATE_CCW_DIR: -1,
  QUEUE_SIZE: 5,            // 다음 조각 큐를 항상 이 길이 이상으로 유지한다
  I_PIECE_ID: 1,            // I 만 월킥 오프셋 표가 다르다
  GHOST_ALPHA: 0.28,        // 고스트(착지 예상 위치) 투명도
  PREVIEW_COUNT: 5,         // 보드 오른쪽에 그릴 다음 조각 수
  PREVIEW_CELL_PX: 18,      // 미리보기·홀드 슬롯의 셀 크기
  PREVIEW_SLOT_COLS: 4,     // 조각 모양이 들어가는 슬롯 폭(셀)
  PREVIEW_SLOT_ROWS: 3,     // 슬롯 높이(셀). 모양 2행 + 여백 1행
  HOLD_SLOT_COUNT: 1,       // 홀드 슬롯은 항상 1칸
  // SRS 월킥 오프셋: [from][to] -> [dx, dy] 5개를 순서대로 시도한다.
  // 첫 오프셋은 항상 [0,0] (밀지 않고 그대로 되는 경우).
  // 주의: 표준 SRS 표는 y 가 위로 증가한다. 이 코드의 y 는 아래로 증가하므로
  // dy 부호를 전부 뒤집어 옮겼다. 예) 표준 0->R 의 (0,-2)(아래 2칸)는 여기서 [0, 2].
  KICKS: {
    JLSTZ: {
      0: {
        1: [[0,0], [-1,0], [-1,-1], [0,2], [-1,2]],
        3: [[0,0], [1,0], [1,-1], [0,2], [1,2]],
      },
      1: {
        0: [[0,0], [1,0], [1,1], [0,-2], [1,-2]],
        2: [[0,0], [1,0], [1,1], [0,-2], [1,-2]],
      },
      2: {
        1: [[0,0], [-1,0], [-1,-1], [0,2], [-1,2]],
        3: [[0,0], [1,0], [1,-1], [0,2], [1,2]],
      },
      3: {
        2: [[0,0], [-1,0], [-1,1], [0,-2], [-1,-2]],
        0: [[0,0], [-1,0], [-1,1], [0,-2], [-1,-2]],
      },
    },
    I: {
      0: {
        1: [[0,0], [-2,0], [1,0], [-2,1], [1,-2]],
        3: [[0,0], [-1,0], [2,0], [-1,-2], [2,1]],
      },
      1: {
        0: [[0,0], [2,0], [-1,0], [2,-1], [-1,2]],
        2: [[0,0], [-1,0], [2,0], [-1,-2], [2,1]],
      },
      2: {
        1: [[0,0], [1,0], [-2,0], [1,2], [-2,-1]],
        3: [[0,0], [2,0], [-1,0], [2,-1], [-1,2]],
      },
      3: {
        2: [[0,0], [-2,0], [1,0], [-2,1], [1,-2]],
        0: [[0,0], [1,0], [-2,0], [1,2], [-2,-1]],
      },
    },
  },
  // 색은 CSS 커스텀 프로퍼티가 유일한 출처다. 여기엔 이름만 둔다.
  CSS_VARS: {
    GRID: '--color-grid',
    PIECE_PREFIX: '--piece-',   // --piece-1 ~ --piece-7
  },
  // 조각 모양: id -> 회전 상태 0..3 -> 셀 [col, row] 오프셋 목록.
  // 회전 로직은 T-002 이후. 여기서는 데이터만 준비한다.
  SHAPES: {
    1: [ // I
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]],
    ],
    2: [ // J
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]],
    ],
    3: [ // L
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]],
    ],
    4: [ // O
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
    ],
    5: [ // S
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]],
    ],
    6: [ // T
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]],
    ],
    7: [ // Z
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]],
    ],
  },
};

const PIECE_IDS = Object.keys(CONFIG.SHAPES).map(Number);
const VISIBLE_ROWS = CONFIG.ROWS - CONFIG.BUFFER_ROWS;
const MAX_LEVEL = Math.max(...Object.keys(CONFIG.LEVEL_INTERVALS_MS).map(Number));

/* ============================================================
 * LOGIC — 순수 함수. canvas 도, 시간도, DOM 도 모른다.
 * ============================================================ */

/** 빈 보드를 만든다. 인덱스 = row * COLS + col */
function createBoard() {
  return new Uint8Array(CONFIG.ROWS * CONFIG.COLS);
}

function cellIndex(col, row) {
  return row * CONFIG.COLS + col;
}

/** 조각이 차지하는 절대 좌표 [col, row] 목록. 원본을 건드리지 않는다. */
function pieceCells(piece) {
  return CONFIG.SHAPES[piece.id][piece.rot].map(
    ([dx, dy]) => [piece.x + dx, piece.y + dy]
  );
}

/** 벽/바닥/기존 블록과 겹치는가. board 를 읽기만 한다. */
function collides(board, piece) {
  return pieceCells(piece).some(([col, row]) => {
    if (col < 0 || col >= CONFIG.COLS) return true;
    if (row >= CONFIG.ROWS) return true;
    if (row < 0) return false;
    return board[cellIndex(col, row)] !== CONFIG.EMPTY;
  });
}

/** 조각을 고정한 새 보드를 반환한다. 인자 board 는 변형하지 않는다. */
function lockPiece(board, piece) {
  const next = board.slice();
  for (const [col, row] of pieceCells(piece)) {
    if (row >= 0 && row < CONFIG.ROWS && col >= 0 && col < CONFIG.COLS) {
      next[cellIndex(col, row)] = piece.id;
    }
  }
  return next;
}

/** 그 행의 모든 셀이 차 있는가. board 를 읽기만 한다. */
function isRowFull(board, row) {
  for (let col = 0; col < CONFIG.COLS; col++) {
    if (board[cellIndex(col, row)] === CONFIG.EMPTY) return false;
  }
  return true;
}

/** 가득 찬 행을 지우고 위 행들을 내린 새 보드를 반환한다.
 *  인자 board 는 변형하지 않는다. 버퍼 행도 대상이다.
 *  -> { board: 새 보드, clearedRows: 지워진 행 번호(아래에서 위 순서) } */
function clearLines(board) {
  const next = board.slice();
  const clearedRows = [];
  let writeRow = CONFIG.ROWS - 1;
  for (let row = CONFIG.ROWS - 1; row >= 0; row--) {
    if (isRowFull(board, row)) {
      clearedRows.push(row);
      continue;
    }
    for (let col = 0; col < CONFIG.COLS; col++) {
      next[cellIndex(col, writeRow)] = board[cellIndex(col, row)];
    }
    writeRow--;
  }
  for (let row = writeRow; row >= 0; row--) {
    for (let col = 0; col < CONFIG.COLS; col++) {
      next[cellIndex(col, row)] = CONFIG.EMPTY;
    }
  }
  return { board: next, clearedRows };
}

/** 지운 줄 수와 현재 레벨로 얻는 점수. 표에 없는 줄 수는 0점. */
function lineClearScore(clearedCount, level) {
  const base = CONFIG.LINE_SCORES[clearedCount];
  return base === undefined ? 0 : base * level;
}

/** 누적 클리어 줄 수 -> 레벨. LINES_PER_LEVEL 줄마다 +1. */
function levelForClearedLines(clearedLines) {
  const gained = Math.floor(clearedLines / CONFIG.LINES_PER_LEVEL);
  return CONFIG.START_LEVEL + gained;
}

/** 레벨 -> 낙하 간격(ms). 표 밖의 레벨은 마지막 값으로 고정한다. */
function levelIntervalMs(level) {
  const clamped = Math.min(Math.max(level, CONFIG.START_LEVEL), MAX_LEVEL);
  return CONFIG.LEVEL_INTERVALS_MS[clamped];
}

/** 한 칸 내려간 새 조각. 인자 piece 는 변형하지 않는다. */
function movedDown(piece) {
  return { ...piece, y: piece.y + 1 };
}

/** (dx, dy) 만큼 옮긴 새 조각. 인자 piece 는 변형하지 않는다. */
function movedBy(piece, dx, dy) {
  return { ...piece, x: piece.x + dx, y: piece.y + dy };
}

/** dir(+1 시계 / -1 반시계) 만큼 회전한 새 조각. 인자 piece 는 변형하지 않는다.
 *  모양은 CONFIG.SHAPES 테이블 조회로만 바뀌므로 조각별 분기가 없다. */
function rotated(piece, dir) {
  const states = CONFIG.ROTATION_STATES;
  return { ...piece, rot: (piece.rot + dir + states) % states };
}

function spawnPiece(id) {
  return { id, rot: 0, x: CONFIG.SPAWN_X, y: CONFIG.SPAWN_Y };
}

/** 조각 id 에 맞는 월킥 표. I 만 오프셋이 다르고 나머지는 공용이다. */
function kickOffsets(pieceId, fromRot, toRot) {
  const table = pieceId === CONFIG.I_PIECE_ID ? CONFIG.KICKS.I : CONFIG.KICKS.JLSTZ;
  return table[fromRot] && table[fromRot][toRot];
}

/** 월킥을 적용한 회전. 성공하면 새 piece, 5개 오프셋이 모두 막히면 null.
 *  board 와 piece 를 변형하지 않는다. 실패는 예외가 아니라 null 이다. */
function tryRotate(board, piece, dir) {
  const turned = rotated(piece, dir);
  const offsets = kickOffsets(piece.id, piece.rot, turned.rot);
  if (!offsets) return null;
  for (const [dx, dy] of offsets) {
    const candidate = movedBy(turned, dx, dy);
    if (!collides(board, candidate)) return candidate;
  }
  return null;
}

/** 조각이 하드 드롭될 위치의 새 piece. board 와 piece 를 변형하지 않는다.
 *  반환값에서 한 칸 더 내려가면 반드시 collides 가 true 다. */
function dropPosition(board, piece) {
  let landed = movedBy(piece, 0, 0);
  while (!collides(board, movedDown(landed))) {
    landed = movedDown(landed);
  }
  return landed;
}

/** 새 배열을 셔플해 반환한다. 인자를 변형하지 않는다. */
function shuffled(items) {
  const next = items.slice();
  for (let i = next.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const swap = next[i];
    next[i] = next[j];
    next[j] = swap;
  }
  return next;
}

/* ============================================================
 * STATE — 보드, 현재 조각, 7-bag 큐, 낙하 누적 시간, 종료 여부.
 * ============================================================ */
const state = {
  board: createBoard(),
  piece: null,          // 아래에서 큐로부터 채운다
  bag: [],              // 아직 뽑지 않은 현재 bag 의 조각 id
  queue: [],            // 다음에 나올 조각 id. 항상 CONFIG.QUEUE_SIZE 이상
  dropAccumulatorMs: 0,
  isOver: false,
  lockedCount: 0,
  lockTimerMs: null,    // null = 접지하지 않음. 접지 중이면 누적 유예 시간(ms)
  lockResetCount: 0,    // 현재 조각이 유예를 리셋한 횟수. LOCK_RESET_LIMIT 까지
  score: 0,
  clearedLines: 0,
  level: CONFIG.START_LEVEL,
  isSoftDropping: false,
  hold: null,           // 보관 중인 조각 id. null 이면 보관함이 비어 있다
  canHold: true,        // 조각 하나가 고정될 때까지 홀드는 1회만
};

/** 7-bag 에서 다음 조각 id 하나를 뽑는다. bag 이 비면 새로 셔플해 채운다. */
function nextPieceId() {
  if (state.bag.length === 0) {
    state.bag = shuffled(PIECE_IDS);   // 한 bag = PIECE_IDS 전체가 정확히 한 번씩
  }
  const [head, ...rest] = state.bag;
  state.bag = rest;
  return head;
}

/** 큐를 CONFIG.QUEUE_SIZE 이상으로 채운다. */
function refillQueue() {
  while (state.queue.length < CONFIG.QUEUE_SIZE) {
    state.queue = [...state.queue, nextPieceId()];
  }
}

/** 큐 맨 앞 조각 id 를 꺼낸다. 꺼낸 뒤에도 큐 길이는 QUEUE_SIZE 이상이다. */
function takeQueuedPieceId() {
  refillQueue();
  const [head, ...rest] = state.queue;
  state.queue = rest;
  refillQueue();
  return head;
}

state.piece = spawnPiece(takeQueuedPieceId());

/** 게임 규칙이 아니라 화면/조작 상태. LOGIC 은 이것을 모른다. */
const ui = {
  isPaused: false,
};

/* ============================================================
 * RENDER — canvas 만 안다. 규칙은 모른다.
 * ============================================================ */
/** 색은 :root 커스텀 프로퍼티에서만 읽는다. JS 에 색 리터럴을 두지 않는다. */
const rootStyle = getComputedStyle(document.documentElement);
function cssColor(varName) {
  return rootStyle.getPropertyValue(varName).trim();
}
const COLORS = {
  GRID: cssColor(CONFIG.CSS_VARS.GRID),
};
for (const id of PIECE_IDS) {
  COLORS[id] = cssColor(CONFIG.CSS_VARS.PIECE_PREFIX + id);
}

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.COLS * CONFIG.CELL_PX;
canvas.height = VISIBLE_ROWS * CONFIG.CELL_PX;

const holdCanvas = document.getElementById('hold');
const holdCtx = holdCanvas.getContext('2d');
const previewCanvas = document.getElementById('preview');
const previewCtx = previewCanvas.getContext('2d');
const SLOT_WIDTH_PX = CONFIG.PREVIEW_SLOT_COLS * CONFIG.PREVIEW_CELL_PX;
const SLOT_HEIGHT_PX = CONFIG.PREVIEW_SLOT_ROWS * CONFIG.PREVIEW_CELL_PX;
holdCanvas.width = SLOT_WIDTH_PX;
holdCanvas.height = CONFIG.HOLD_SLOT_COUNT * SLOT_HEIGHT_PX;
previewCanvas.width = SLOT_WIDTH_PX;
previewCanvas.height = CONFIG.PREVIEW_COUNT * SLOT_HEIGHT_PX;

/** 그리기 대상: 어느 ctx 에 어떤 셀 크기로, 어느 행을 화면 0 으로 볼 것인가.
 *  offsetRows 만큼 위로 밀어 그린다. 버퍼 행은 음수 y 가 되어 화면 밖으로 나간다. */
const BOARD_TARGET = {
  ctx,
  cellPx: CONFIG.CELL_PX,
  offsetRows: CONFIG.BUFFER_ROWS,
  alpha: 1,
};
const GHOST_TARGET = { ...BOARD_TARGET, alpha: CONFIG.GHOST_ALPHA };

function drawGrid() {
  ctx.strokeStyle = COLORS.GRID;
  ctx.lineWidth = CONFIG.GRID_LINE_PX;
  const half = CONFIG.GRID_LINE_PX / 2;
  for (let col = 0; col <= CONFIG.COLS; col++) {
    const x = col * CONFIG.CELL_PX + half;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let row = 0; row <= VISIBLE_ROWS; row++) {
    const y = row * CONFIG.CELL_PX + half;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawCell(col, row, pieceId, target = BOARD_TARGET) {
  const y = (row - target.offsetRows) * target.cellPx;
  if (y + target.cellPx <= 0) return;
  const inset = CONFIG.BLOCK_INSET_PX;
  const g = target.ctx;
  g.save();
  g.globalAlpha = target.alpha;
  g.fillStyle = COLORS[pieceId];
  g.fillRect(
    col * target.cellPx + inset,
    y + inset,
    target.cellPx - inset * 2,
    target.cellPx - inset * 2
  );
  g.restore();
}

function drawBoard(board) {
  for (let row = CONFIG.BUFFER_ROWS; row < CONFIG.ROWS; row++) {
    for (let col = 0; col < CONFIG.COLS; col++) {
      const value = board[cellIndex(col, row)];
      if (value !== CONFIG.EMPTY) drawCell(col, row, value);
    }
  }
}

/** 슬롯 하나에 회전 0 모양을 그린다. 슬롯 인덱스만큼 아래로 내려간다. */
function drawSlotPiece(slotCtx, pieceId, slotIndex) {
  const target = {
    ctx: slotCtx,
    cellPx: CONFIG.PREVIEW_CELL_PX,
    offsetRows: -slotIndex * CONFIG.PREVIEW_SLOT_ROWS,
    alpha: 1,
  };
  for (const [col, row] of pieceCells(spawnPiece(pieceId))) {
    drawCell(col - CONFIG.SPAWN_X, row, pieceId, target);
  }
}

/** 홀드(왼쪽 1칸)와 다음 조각 미리보기(오른쪽 PREVIEW_COUNT 칸)를 그린다. */
function renderSidePanels(currentState) {
  holdCtx.clearRect(0, 0, holdCanvas.width, holdCanvas.height);
  if (currentState.hold !== null) drawSlotPiece(holdCtx, currentState.hold, 0);

  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  const upcoming = currentState.queue.slice(0, CONFIG.PREVIEW_COUNT);
  upcoming.forEach((pieceId, slotIndex) => {
    drawSlotPiece(previewCtx, pieceId, slotIndex);
  });
}

const VEIL = { NONE: 'none', PAUSE: 'pause', OVER: 'over' };

const hud = {
  stage: document.getElementById('stage'),
  score: document.getElementById('score'),
  level: document.getElementById('level'),
  lines: document.getElementById('lines'),
  finalScore: document.getElementById('final-score'),
  pauseVeil: document.getElementById('veil-pause'),
  overVeil: document.getElementById('veil-over'),
};

/** 마지막으로 화면에 쓴 값. 여기와 같으면 DOM 을 건드리지 않는다. */
const shown = {
  score: null, level: null, lines: null, finalScore: null, veil: null,
};

/** 값이 바뀐 프레임에만 textContent 에 대입한다. */
function setReadout(key, element, value) {
  if (shown[key] === value) return;
  shown[key] = value;
  element.textContent = value;
}

function currentVeil(currentState) {
  if (currentState.isOver) return VEIL.OVER;
  return ui.isPaused ? VEIL.PAUSE : VEIL.NONE;
}

/** 오버레이는 상태가 바뀐 프레임에만 토글한다. */
function renderVeil(currentState) {
  const veil = currentVeil(currentState);
  if (shown.veil === veil) return;
  shown.veil = veil;
  hud.pauseVeil.hidden = veil !== VEIL.PAUSE;
  hud.overVeil.hidden = veil !== VEIL.OVER;
  hud.stage.classList.toggle('is-over', veil === VEIL.OVER);
}

function renderHud(currentState) {
  setReadout('score', hud.score, currentState.score);
  setReadout('level', hud.level, currentState.level);
  setReadout('lines', hud.lines, currentState.clearedLines);
  setReadout('finalScore', hud.finalScore, currentState.score);
  renderVeil(currentState);
}

function render(currentState) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawBoard(currentState.board);
  const ghost = dropPosition(currentState.board, currentState.piece);
  for (const [col, row] of pieceCells(ghost)) {
    drawCell(col, row, ghost.id, GHOST_TARGET);
  }
  for (const [col, row] of pieceCells(currentState.piece)) {
    drawCell(col, row, currentState.piece.id);
  }
  renderSidePanels(currentState);
  renderHud(currentState);
}

/* ============================================================
 * INPUT — 키 이벤트를 의도 객체로만 바꾼다. 규칙은 실행하지 않는다.
 *   { type: 'move', dx }, { type: 'rotate', dir },
 *   { type: 'softDrop', active }, { type: 'hardDrop' }, { type: 'hold' }
 * 의도를 LOGIC 에 적용하는 것은 LOOP 의 advance() 책임이다.
 * ============================================================ */
const input = {
  intents: [],
  heldDx: 0,          // 0 이면 좌우 키를 누르고 있지 않음
  repeatTimerMs: 0,
  isDasCharged: false,
};

function pushIntent(intent) {
  input.intents.push(intent);
}

/** 큐를 비우고 쌓인 의도를 넘긴다. */
function takeIntents() {
  const taken = input.intents;
  input.intents = [];
  return taken;
}

/** 좌우 키를 누르고 있는 동안 DAS 후 ARR 간격으로 move 의도를 만든다. */
function updateAutoRepeat(deltaMs) {
  if (input.heldDx === 0) return;
  input.repeatTimerMs += deltaMs;
  while (true) {
    const thresholdMs = input.isDasCharged ? CONFIG.ARR_MS : CONFIG.DAS_MS;
    if (input.repeatTimerMs < thresholdMs) break;
    input.repeatTimerMs -= thresholdMs;
    input.isDasCharged = true;
    pushIntent({ type: 'move', dx: input.heldDx });
    if (thresholdMs <= 0) break;   // ARR 0 에서 무한 루프 방지
  }
}

function startHorizontalHold(dx) {
  if (input.heldDx === dx) return;
  input.heldDx = dx;
  input.repeatTimerMs = 0;
  input.isDasCharged = false;
  pushIntent({ type: 'move', dx });
}

function stopHorizontalHold(dx) {
  if (input.heldDx !== dx) return;
  input.heldDx = 0;
  input.repeatTimerMs = 0;
  input.isDasCharged = false;
}

/** 눌린 채로 남은 좌우 키와 아직 소비되지 않은 의도를 모두 버린다. */
function clearHeldKeys() {
  input.intents = [];
  input.heldDx = 0;
  input.repeatTimerMs = 0;
  input.isDasCharged = false;
}

function keyToDx(key) {
  if (key === CONFIG.KEYS.LEFT) return -1;
  if (key === CONFIG.KEYS.RIGHT) return 1;
  return 0;
}

function keyToRotationDir(key) {
  if (CONFIG.KEYS.ROTATE_CW.includes(key)) return CONFIG.ROTATE_CW_DIR;
  if (CONFIG.KEYS.ROTATE_CCW.includes(key)) return CONFIG.ROTATE_CCW_DIR;
  return 0;
}

function isHoldKey(key) {
  return CONFIG.KEYS.HOLD.includes(key);
}

function isPauseKey(key) {
  return CONFIG.KEYS.PAUSE.includes(key);
}

function isRestartKey(key) {
  return CONFIG.KEYS.RESTART.includes(key);
}

function isBoundKey(key) {
  return keyToDx(key) !== 0
    || keyToRotationDir(key) !== 0
    || isHoldKey(key)
    || key === CONFIG.KEYS.SOFT_DROP
    || key === CONFIG.KEYS.HARD_DROP;
}

function handleKeyDown(event) {
  const key = event.key;
  if (isPauseKey(key) || isRestartKey(key)) {
    event.preventDefault();
    if (event.repeat) return;
    if (isPauseKey(key)) togglePause();
    else resetGame();
    return;
  }
  if (!isBoundKey(key)) return;
  event.preventDefault();
  // 일시정지·게임오버 중에는 의도 자체를 만들지 않는다. state.piece 는 불변이다.
  if (ui.isPaused || state.isOver) return;
  if (event.repeat) return;   // 자동 반복은 DAS/ARR 이 담당한다

  const dx = keyToDx(key);
  if (dx !== 0) {
    startHorizontalHold(dx);
    return;
  }
  const dir = keyToRotationDir(key);
  if (dir !== 0) {
    pushIntent({ type: 'rotate', dir });
    return;
  }
  if (isHoldKey(key)) {
    pushIntent({ type: 'hold' });
    return;
  }
  if (key === CONFIG.KEYS.SOFT_DROP) {
    pushIntent({ type: 'softDrop', active: true });
    return;
  }
  pushIntent({ type: 'hardDrop' });
}

function handleKeyUp(event) {
  const key = event.key;
  if (!isBoundKey(key)) return;
  event.preventDefault();

  const dx = keyToDx(key);
  if (dx !== 0) {
    stopHorizontalHold(dx);
    return;
  }
  if (key === CONFIG.KEYS.SOFT_DROP) {
    pushIntent({ type: 'softDrop', active: false });
  }
}

window.addEventListener('keydown', handleKeyDown);
window.addEventListener('keyup', handleKeyUp);

/* ============================================================
 * LOOP — 델타 타임 누적. 프레임레이트와 무관하게 낙하 간격이 같다.
 * ============================================================ */

/** 현재 조각이 한 칸도 못 내려가는 상태인가(= 접지). */
function isPieceLanded() {
  return collides(state.board, movedDown(state.piece));
}

/** 유예 타이머를 해제한다. 새 조각 스폰과 공중 복귀가 쓴다. */
function clearLockTimer() {
  state.lockTimerMs = null;
  state.lockResetCount = 0;
}

/** 이동·회전이 실제로 성공했을 때의 유예 리셋.
 *  접지 중이 아니면 아무 일도 없고, 상한에 도달했으면 더 리셋하지 않는다. */
function noteLockReset() {
  if (state.lockTimerMs === null) return;
  if (state.lockResetCount >= CONFIG.LOCK_RESET_LIMIT) return;
  state.lockResetCount++;
  state.lockTimerMs = 0;
}

/** 지운 줄 수를 점수·누적 줄 수·레벨에 반영한다. 점수는 레벨업 전 레벨 기준. */
function applyLineClears(clearedCount) {
  if (clearedCount === 0) return;
  state.score += lineClearScore(clearedCount, state.level);
  state.clearedLines += clearedCount;
  state.level = levelForClearedLines(state.clearedLines);
}

/** 현재 조각을 고정하고, 줄을 지우고, 다음 조각을 스폰한다. */
function lockAndSpawn() {
  const locked = lockPiece(state.board, state.piece);
  const cleared = clearLines(locked);
  state.board = cleared.board;
  state.lockedCount++;
  applyLineClears(cleared.clearedRows.length);
  clearLockTimer();
  const spawned = spawnPiece(takeQueuedPieceId());
  if (collides(state.board, spawned)) {
    state.isOver = true;
    console.log('game over');
    return;
  }
  state.piece = spawned;
  state.canHold = true;
}

/** 낙하 1회. 내려갈 수 없으면 고정하지 않는다 — 유예는 updateLockTimer 가 센다. */
function stepDown() {
  const next = movedDown(state.piece);
  if (collides(state.board, next)) return;
  state.piece = next;
  if (state.isSoftDropping) state.score += CONFIG.SOFT_DROP_POINTS_PER_CELL;
}

/** 접지 상태면 유예를 누적하고, LOCK_DELAY_MS 를 넘기면 고정한다.
 *  다시 내려갈 수 있게 되면 타이머를 해제한다. 시간을 아는 것은 LOOP 뿐이다. */
function updateLockTimer(deltaMs) {
  if (state.isOver) return;
  if (!isPieceLanded()) {
    if (state.lockTimerMs !== null) clearLockTimer();
    return;
  }
  state.lockTimerMs = (state.lockTimerMs === null ? 0 : state.lockTimerMs) + deltaMs;
  if (state.lockTimerMs >= CONFIG.LOCK_DELAY_MS) lockAndSpawn();
}

/** 겹치지 않을 때만 조각을 교체한다. 교체했으면 true. 이동 경로가 쓴다. */
function tryReplacePiece(candidate) {
  if (collides(state.board, candidate)) return false;
  state.piece = candidate;
  return true;
}

/** 더 못 내려갈 때까지 내린 뒤 유예 없이 같은 프레임에 고정한다. */
function hardDrop() {
  let landed = state.piece;
  let cells = 0;
  while (!collides(state.board, movedDown(landed))) {
    landed = movedDown(landed);
    cells++;
  }
  state.piece = landed;
  state.score += cells * CONFIG.HARD_DROP_POINTS_PER_CELL;
  lockAndSpawn();
  state.dropAccumulatorMs = 0;
}

/** 현재 조각을 보관함과 맞바꾼다. 보관함이 비어 있으면 큐에서 꺼낸다.
 *  나온 조각은 rot 0, 스폰 좌표로 초기화된다. 조각당 1회만 허용한다. */
function holdCurrentPiece() {
  if (!state.canHold) return;
  const storedId = state.hold;
  state.hold = state.piece.id;
  state.piece = spawnPiece(storedId === null ? takeQueuedPieceId() : storedId);
  state.canHold = false;
  state.dropAccumulatorMs = 0;
  clearLockTimer();
}

function applyIntent(intent) {
  if (state.isOver) return;
  if (intent.type === 'move') {
    if (tryReplacePiece(movedBy(state.piece, intent.dx, 0))) noteLockReset();
    return;
  }
  if (intent.type === 'rotate') {
    const rotatedPiece = tryRotate(state.board, state.piece, intent.dir);
    if (rotatedPiece === null) return;
    state.piece = rotatedPiece;
    noteLockReset();
    return;
  }
  if (intent.type === 'softDrop') {
    state.isSoftDropping = intent.active;
    return;
  }
  if (intent.type === 'hold') {
    holdCurrentPiece();
    return;
  }
  if (intent.type === 'hardDrop') hardDrop();
}

/** 레벨별 낙하 간격. 소프트 드롭 중이면 SOFT_DROP_DIVISOR 로 나눈다. */
function dropIntervalMs() {
  const base = levelIntervalMs(state.level);
  return state.isSoftDropping ? base / CONFIG.SOFT_DROP_DIVISOR : base;
}

/** 정지 중인가. 정지 중이면 LOOP 는 advance() 를 부르지 않는다. */
function isHalted() {
  return ui.isPaused || state.isOver;
}

/** 일시정지 전환. 게임오버 상태에서는 무시한다. */
function setPaused(next) {
  if (state.isOver || ui.isPaused === next) return;
  ui.isPaused = next;
  clearHeldKeys();
}

function togglePause() {
  setPaused(!ui.isPaused);
}

/** 게임을 초기 상태로 되돌린다. state 필드를 초기값으로 다시 채운다. */
function resetGame() {
  state.board = createBoard();
  state.bag = [];
  state.queue = [];
  state.dropAccumulatorMs = 0;
  state.isOver = false;
  state.lockedCount = 0;
  state.lockTimerMs = null;
  state.lockResetCount = 0;
  state.score = 0;
  state.clearedLines = 0;
  state.level = CONFIG.START_LEVEL;
  state.isSoftDropping = false;
  state.hold = null;
  state.canHold = true;
  state.piece = spawnPiece(takeQueuedPieceId());
  ui.isPaused = false;
  clearHeldKeys();
}

// 탭이 백그라운드로 가면 자동 일시정지. 복귀 프레임의 큰 델타가 소비되지 않는다.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) setPaused(true);
});

function advance(deltaMs) {
  updateAutoRepeat(deltaMs);
  for (const intent of takeIntents()) applyIntent(intent);

  state.dropAccumulatorMs += deltaMs;
  while (state.dropAccumulatorMs >= dropIntervalMs() && !state.isOver) {
    state.dropAccumulatorMs -= dropIntervalMs();
    stepDown();
  }
  updateLockTimer(deltaMs);
}

let lastFrameMs = null;
function frame(nowMs) {
  const deltaMs = lastFrameMs === null
    ? 0
    : Math.min(nowMs - lastFrameMs, CONFIG.MAX_FRAME_MS);
  lastFrameMs = nowMs;
  if (!isHalted()) advance(deltaMs);
  render(state);
  requestAnimationFrame(frame);   // 재시작을 받으려면 정지 중에도 계속 돈다
}

render(state);
requestAnimationFrame(frame);
</script>
</body>
</html>
